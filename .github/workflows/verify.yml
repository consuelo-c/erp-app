name: Verify

on:
  pull_request:

jobs:
  # The job name is the required status check in the main ruleset: keep it "test".
  # Only the PR's changes are tested and linted; deploy.yml runs the full suite before deploying.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The base branch, to diff the PR against it.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      # The changed files' tests and those of every file importing them; a config change reruns all.
      - run: npx vitest run --changed origin/${{ github.base_ref }} --passWithNoTests
      - name: ESLint on the changed files
        run: |
          git diff -z --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            | grep -zE '\.(js|ts|svelte)$' \
            | xargs -0 -r npx eslint --no-warn-ignored
      - name: Stylelint on the changed files
        run: |
          git diff -z --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            | grep -zE '^src/.*\.(css|svelte)$' \
            | xargs -0 -r npx stylelint --allow-empty-input
