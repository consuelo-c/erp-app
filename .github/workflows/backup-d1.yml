name: Back up D1

on:
  schedule:
    # 08:00 UTC is 03:00 in Bogotá; odd calendar days, so gaps are 1 or 2 days.
    - cron: '0 8 1-31/2 * *'
  workflow_dispatch:

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Computed once, so the exported file and the uploaded key carry the same time.
      - id: name
        run: echo "file=consueloc-erp-db-$(date -u +%Y-%m-%dT%H-%M-%SZ).sql" >> "$GITHUB_OUTPUT"
      - run: npx wrangler d1 export consueloc-erp-db --remote --output "$RUNNER_TEMP/${{ steps.name.outputs.file }}"
      # --remote is required: without it, Wrangler writes to the local bucket. Retention is the R2 lifecycle rule `d1-backups`.
      - run: npx wrangler r2 object put "consueloc-erp-arch/backups/d1/${{ steps.name.outputs.file }}" --file "$RUNNER_TEMP/${{ steps.name.outputs.file }}" --remote
