name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Same key as verify.yml: a cache saved on main is the one a new PR's first check restores.
      - id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      # Any failure here stops the deploy before a wrangler step touches production.
      - run: npx vitest run
      - run: npm run lint
      - run: npm run typecheck
      - run: npx wrangler d1 migrations apply consueloc-erp-db --remote
      # Idempotent: only adds the keys production doesn't have yet, never overwrites a value.
      - run: npx wrangler d1 execute consueloc-erp-db --remote --file scripts/settings-defaults.sql
      - run: npm run build
      - run: npx wrangler deploy
