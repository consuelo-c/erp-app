name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      # Wipes production only if migrations/ was squashed and `orders` is empty; fails otherwise.
      - run: node scripts/wipe-d1-if-squashed.js --remote --yes
      - run: npx wrangler d1 migrations apply consueloc-erp-db --remote
      # Idempotent: only adds the keys production doesn't have yet, never overwrites a value.
      - run: npx wrangler d1 execute consueloc-erp-db --remote --file scripts/settings-defaults.sql
      - run: npm run build
      - run: npx wrangler deploy
