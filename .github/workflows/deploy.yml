name: Desplegar

on:
  push:
    branches: [main, staging]

# Un despliegue a la vez por rama
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CF_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Aplicar migraciones de D1
        run: npx wrangler d1 migrations apply DB --env "$CF_ENV" --remote

      - name: Desplegar
        run: npx wrangler deploy --env "$CF_ENV"
